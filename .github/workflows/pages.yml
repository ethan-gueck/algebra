# Test, build the static site/API (python -m general build), and publish it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Live at https://ethan-gueck.github.io/algebra/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4   # runs JS-vs-Python parity tests
        with:
          node-version: "20"
      - run: uv sync --no-default-groups --group dev   # skip Manim: the site doesn't need it
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m general build --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
